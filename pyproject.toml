[project]
name = "rwds-iv-paper"
version = "0.1.0"
description = "Companion code for RWDS article: Information-theoretic foundations of WoE, IV and PSI"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26,<2",
    "pandas>=2.2,<3",
    "scipy>=1.11,<2",
    "matplotlib>=3.8,<4",
    "scikit-learn>=1.3,<2",
    "xgboost>=2.0,<3",
    "pyarrow>=15,<20",
    "fastwoe>=0.1.3",
    "jupyter>=1.0",
    "python-dotenv>=1.0",
    "pytest>=9.0.3",
    "fsspec>=2026.4.0",
    "huggingface-hub>=1.19.0",
    "aiohttp>=3.14.1",
]

[dependency-groups]
dev = [
    "ruff>=0.8",
    "ipykernel>=6.30",
]

[tool.ruff]
line-length = 100
